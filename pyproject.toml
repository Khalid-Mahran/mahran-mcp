[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahran-mcp"
version = "0.1.0"
description = "Portable Gemini, Ollama, terminal and filesystem connections for MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic==2.13.5"]

[project.scripts]
mahran-gemini = "mahran_mcp.gemini:main"
mahran-local = "mahran_mcp.local:main"
mahran-terminal = "mahran_mcp.terminal:main"
mahran-mcp-config = "mahran_mcp.configure:main"

[tool.setuptools.packages.find]
where = ["src"]
